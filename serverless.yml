service: holidays

frameworkVersion: "3"

plugins:
  - serverless-dynamodb-local
  - serverless-offline
  - serverless-api-gateway-throttling


custom:
  myStage: ${opt:stage, self:provider.stage}

  dynamodb:
    start:
      port: 8000
      inMemory: true
      migrate: true
    migration:
      dir: offline/migrations
    stages:
      - dev
      - prod
  # Stage-wide limits; requests over them get 429 before any Lambda runs.
  apiGatewayThrottling:
    maxRequestsPerSecond: 10
    maxConcurrentRequests: 20
  cors:
    origins: ${file(./config/allowedOrigins.json)}
    headers:
      - Content-Type
      - Authorization
      - X-Amz-Date
      - X-Api-Key
      - X-Amz-Security-Token
    allowCredentials: true
  authorizers:
    auth:
      name: authFunc
      type: request
      identitySource: method.request.header.Authorization

package:
  patterns:
    - '!node_modules/aws-sdk/**'
    - '!node_modules/@node-llama-cpp/**'
    - '!node_modules/node-llama-cpp/**'
    - '!node_modules/@tobilu/**'
    - '!node_modules/better-sqlite3/**'
    - '!node_modules/tree-sitter-*/**'
    - '!node_modules/web-tree-sitter/**'
    - '!node_modules/typescript/**'
    - '!node_modules/serverless/**'
    - '!node_modules/serverless-*/**'
    - '!node_modules/@serverless/**'
    - '!node_modules/@types/**'
    - '!.serverless/**'
    - '!.dynamodb/**'
    - '!offline/**'
    - '!scripts/**'
    - '!**/*.md'
    - '!**/*.map'
    - '!tests/**'

provider:
  name: aws
  runtime: nodejs22.x
  logs:
    restApi:
      # One JSON line per request in /aws/api-gateway/holidays-<stage>, used by l3Agent's traffic summary.
      # status and latencyMs are left unquoted so Logs Insights treats them as numbers.
      accessLogging: true
      executionLogging: false
      # Serverless v3 cannot create its default serverlessApiGatewayCloudWatchRole (SDK v3 error-code bug), so supply one.
      role: !GetAtt apiGatewayCloudWatchRole.Arn
      format: '{"requestId":"$context.requestId","time":"$context.requestTime","method":"$context.httpMethod","resource":"$context.resourcePath","status":$context.status,"uid":"$context.authorizer.uid","latencyMs":$context.responseLatency}'
  environment:
    DYNAMODB_TABLE: "holidays"
    STAGE: ${self:custom.myStage}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}
    FAMTREE_GOOGLE_CLIENT_ID: ${env:FAMTREE_GOOGLE_CLIENT_ID, ''}
    TOKEN_SIGNING_SECRET: ${env:TOKEN_SIGNING_SECRET}
    TOKEN_EXPIRY: ${env:TOKEN_EXPIRY, '365d'}
    TOKENS_TABLE: tokens
    DOC_SHARES_TABLE: docShares
    DOCS_BUCKET:
      Ref: docStoreBucket
    SERVICE_NAME: holidays
    LOG_LOOKBACK: 7d
    L3_AGENT_MODEL: ${env:L3_AGENT_MODEL, 'amazon.nova-lite-v1:0'}
    GIT_SHA: ${env:GIT_SHA, 'local'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource: 
        - "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}-${self:custom.myStage}"
        - "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/${self:provider.environment.TOKENS_TABLE}-${self:custom.myStage}"
        - "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/${self:provider.environment.TOKENS_TABLE}-${self:custom.myStage}/index/*"
        - "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/${self:provider.environment.DOC_SHARES_TABLE}-${self:custom.myStage}"
        - "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/${self:provider.environment.DOC_SHARES_TABLE}-${self:custom.myStage}/index/*"
    - Effect: Allow
      Action:
        - apigateway:GET
        - apigateway:POST
        - apigateway:PUT
        - apigateway:DELETE
        - apigateway:PATCH
      Resource: "*"
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:ListBucket
      Resource:
        - Fn::Join:
            - ''
            - - 'arn:aws:s3:::'
              - Ref: docStoreBucket
        - Fn::Join:
            - ''
            - - 'arn:aws:s3:::'
              - Ref: docStoreBucket
              - '/*'
    - Effect: Allow
      Action:
        - logs:StartQuery
        - logs:GetQueryResults
        - logs:DescribeLogGroups
        - logs:FilterLogEvents
      Resource: "*"
    - Effect: Allow
      Action:
        - bedrock:InvokeModel
        - bedrock:InvokeModelWithResponseStream
        - bedrock:Converse
        - bedrock:ConverseStream
      Resource: "*"
    - Effect: Allow
      Action:
        - aws-marketplace:ViewSubscriptions
        - aws-marketplace:Subscribe
        - aws-marketplace:Unsubscribe
      Resource: "*"

functions:
  authFunc:
    handler: auth/auth.authorizer

  version:
    handler: holidays/version.version
    events:
      - http:
          path: version
          method: get
          cors: ${self:custom.cors}

  create:
    handler: holidays/create.create
    events:
      - http:
          path: holidays
          method: post
          cors: ${self:custom.cors}
          authorizer: ${self:custom.authorizers.auth}

  get:
    handler: holidays/get.get
    events:
      - http:
          path: holidays
          method: get
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  update:
    handler: holidays/update.update
    events:
      - http:
          path: holidays/{id}
          method: put
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  generateToken:
    handler: holidays/generateToken.generateToken
    events:
      - http:
          path: generateToken
          method: post
          throttling:
            maxRequestsPerSecond: 0.5
            maxConcurrentRequests: 2
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  getMyTokens:
    handler: holidays/getMyTokens.getMyTokens
    events:
      - http:
          path: tokens
          method: get
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  expireToken:
    handler: holidays/expireToken.expireToken
    events:
      - http:
          path: expireToken
          method: post
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  docsCreate:
    handler: holidays/docs/create.create
    events:
      - http:
          path: docs
          method: post
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  docsList:
    handler: holidays/docs/list.list
    events:
      - http:
          path: docs
          method: get
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  docsGet:
    handler: holidays/docs/get.get
    events:
      - http:
          path: docs/{id}
          method: get
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  docsUpdate:
    handler: holidays/docs/update.update
    events:
      - http:
          path: docs/{id}
          method: put
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  docsDelete:
    handler: holidays/docs/delete.delete
    events:
      - http:
          path: docs/{id}
          method: delete
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  docsShareCreate:
    handler: holidays/docs/shares.create
    events:
      - http:
          path: docs/{id}/shares
          method: post
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  docsShareList:
    handler: holidays/docs/shares.list
    events:
      - http:
          path: docs/{id}/shares
          method: get
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  docsShareRevoke:
    handler: holidays/docs/shares.revoke
    events:
      - http:
          path: docs/{id}/shares/{code}
          method: delete
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  docsSharedGet:
    handler: holidays/docs/shares.getShared
    events:
      - http:
          path: shared/{code}
          method: get
          cors: ${self:custom.cors}
          authorizer:
            name: authFunc
            identitySource: method.request.header.Authorization

  l3Agent:
    handler: agents/l3Agent.l3Agent
    timeout: 300
    memorySize: 512
    events:
      - schedule:
          name: ${self:service}-${self:custom.myStage}-l3Agent
          rate: rate(7 days)
          enabled: true

resources:
  Resources:
    apiGatewayCloudWatchRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: apigateway.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
    docStoreBucket:
      Type: AWS::S3::Bucket

    holidaysTokensTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        AttributeDefinitions:
          - AttributeName: token
            AttributeType: S
          - AttributeName: userid
            AttributeType: S
        KeySchema:
          - AttributeName: token
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: userid-index
            KeySchema:
              - AttributeName: userid
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        TableName: ${self:provider.environment.TOKENS_TABLE}-${self:custom.myStage}

    docSharesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        AttributeDefinitions:
          - AttributeName: code
            AttributeType: S
          - AttributeName: docKey
            AttributeType: S
        KeySchema:
          - AttributeName: code
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: docKey-index
            KeySchema:
              - AttributeName: docKey
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        TableName: ${self:provider.environment.DOC_SHARES_TABLE}-${self:custom.myStage}

    # holidaysDynamoDbTable:
    #   Type: 'AWS::DynamoDB::Table'
    #   DeletionPolicy: Retain
    #   UpdateReplacePolicy: Retain
    #   Properties:
    #     AttributeDefinitions:
    #       -
    #         AttributeName: id
    #         AttributeType: S
    #     KeySchema:
    #       -
    #         AttributeName: id
    #         KeyType: HASH
    #     ProvisionedThroughput:
    #       ReadCapacityUnits: 1
    #       WriteCapacityUnits: 1
    #     TableName: ${self:provider.environment.DYNAMODB_TABLE}-${self:custom.myStage}
        
    AuthFailureGatewayResponse:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: 'ApiGatewayRestApi'
        StatusCode: '401'
