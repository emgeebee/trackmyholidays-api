name: Deploy Serverless

on:
    pull_request:
      types: [opened, synchronize, reopened]
    push:
      branches:
        - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set environment
        run: echo "STAGE=${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}" >> $GITHUB_ENV

      - name: Configure AWS Profile
        run: |
          mkdir -p ~/.aws
          echo "[main]" > ~/.aws/credentials
          echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "[main]" > ~/.aws/config
          echo "region=us-west-2" >> ~/.aws/config
          echo "output=json" >> ~/.aws/config

      - name: Deploy to AWS
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          FAMTREE_GOOGLE_CLIENT_ID: ${{ vars.FAMTREE_GOOGLE_CLIENT_ID }}
          TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx serverless deploy --stage ${{ env.STAGE }} --aws-profile main -r us-west-2

      - name: Get API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name holidays-${{ env.STAGE }} --profile main --region us-west-2 \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceEndpoint'].OutputValue" --output text)
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "Could not find ServiceEndpoint output for holidays-${{ env.STAGE }}" >&2
            exit 1
          fi
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT

      - name: Live API tests
        if: env.STAGE == 'dev'
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
          AWS_PROFILE: main
          AWS_REGION: us-west-2
        run: npm run test:live

